server {
    listen 80;
    root /usr/share/nginx/html;

    # Serve static files; fall back to index.html for SPA-style routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy WebSocket connections to the Python backend
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Keep long-lived connections alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy health check to backend
    location /health {
        proxy_pass http://backend:8000;
    }

    # Cache Potree assets aggressively (they never change at runtime)
    location /potree/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
