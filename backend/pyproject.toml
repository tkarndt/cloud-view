[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-view-backend"
version = "0.1.0"
description = "Real-time camera sync backend for collaborative point cloud viewing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.11",
    "black>=24",
    "flake8>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_view"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "src"

[tool.black]
line-length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
